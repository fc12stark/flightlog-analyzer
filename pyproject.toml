[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_backend"

[project]
name = "flightlog-analyzer"
version = "0.1.0"
description = "A Python CLI tool to analyze PX4 ULog files and produce flight reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyulog>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
flightlog-analyzer = "flightlog_analyzer.cli:main"
list-topics = "flightlog_analyzer.list_topics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
